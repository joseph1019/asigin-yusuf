 <!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Aşığın Yusuf</title>
  <style>
    body {
      background-color: #0d1b2a;
      color: white;
      font-family: Georgia, serif;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #c0aaff;
      margin-bottom: 40px;
    }

    .poem {
      font-size: 1.2rem;
      line-height: 1.8;
      white-space: pre-line;
      margin-bottom: 50px;
    }

    .image-container {
      margin-top: 30px;
    }

    img {
      width: 300px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.3);
    }

    .caption {
      margin-top: 10px;
      font-style: italic;
      color: #f0f0f0;
    }
  </style>
</head>
<body>

  <h1>Aşığın Yusuf</h1>

  <div class="poem">
    aşktır cennetten bitmeyen bir sevap<br>
    seni görünce olur lisanım harap<br>
    aşktır beni eyleyen vahap<br>
    olur yanımızda bir ahbap<br>
    aşkın okuması bitmeyen bir kitap<br>
    yemeğe olur inanılmaz bir şap<br>
    herkes aşkla olmaz mı bitap<br>
    cem’im sen bana oldun yeni bir hitap.
  </div>

  <div class="image-container">
    <img src="cem_ve_yusuf.png" alt="Cem ve Yusuf">
    <div class="caption">Cem’imle ben... bir karede ölümsüz 💙</div>
  </div>

</body>
</html>
