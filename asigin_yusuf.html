
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Aşığın Yusuf</title>
  <style>
    body {
      background-color: #0b1e3f;
      color: #ffffff;
      font-family: Georgia, serif;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      color: #c0aaff;
    }
    .poem {
      margin-top: 4rem;
      white-space: pre-line;
      font-size: 1.2rem;
      line-height: 1.8;
    }
    .footer {
      margin-top: 3rem;
      font-size: 1rem;
      color: #a0c4ff;
    }
  </style>
</head>
<body>
  <h1>Aşığın Yusuf</h1>
  <div class="poem">
    aşktır cennetten bitmeyen bir sevap<br>
    seni görünce olur lisanım harap<br>
    aşktır beni eyleyen vahap<br>
    olur yanımızda bir ahbap<br>
    aşkın okuması bitmeyen bir kitap<br>
    yemeğe olur inanılmaz bir şap<br>
    herkes aşkla olmaz mı bitap<br>
    cem’im sen bana oldun yeni bir hitap
  </div>
  <div class="footer">Yusuf’tan Cem’ine sonsuz bir hitap 💙</div>
</body>
</html>
